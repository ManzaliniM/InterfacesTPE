<!DOCTYPE html>
<!-- HOMEPAGE -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>‧₊˚ 𑣲 ⏾. ⋅ M○○N Arcade ⭒.˚</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/carousel.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body id="top">
    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen">
        <div class="stars-layer"></div>

        <div class="loader-scene">
            <div class="pixel-rocket">
                <div class="rocket-flame"></div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>

            <p class="loader-percent"><span id="loader-percent-value">0</span>%</p>
            <p class="loading-text">Cargando...</p>
        </div>
    </div>

    <div id="nav-placeholder"></div>

    <!-- DESTACADOS -->
    <section class="featured" aria-labelledby="featured-title">
        <div class="carousel" id="featured-carousel">
            <!-- El track se iniciará vacío y la API inyectará aquí las tarjetas dinámicamente -->
            <div class="carousel__track" id="carousel-track" aria-live="polite"></div>

            <!-- Las flechas se mantienen tal como estaban en tu diseño original -->
            <button class="carousel__arrow carousel__arrow--prev" id="prev" type="button" aria-label="Juego anterior">
                <img src="assets/icons/arrow-left.svg" alt="" aria-hidden="true" />
            </button>

            <button class="carousel__arrow carousel__arrow--next" id="next" type="button" aria-label="Juego siguiente">
                <img src="assets/icons/arrow-right.svg" alt="" aria-hidden="true" />
            </button>
        </div>
    </section>

    <!-- CARRUSELES CHICOS -->
    <section id="juegos-recomendados">
        <h3>Juegos recomendados</h3>
        <div class="carrusel-wrapper">
            <button class="carousel__arrow carousel__arrow--prev btn-previous" type="button" aria-label="Anterior">
                <img src="assets/icons/arrow-left.svg" alt="" aria-hidden="true" />
            </button>

            <div id="carrusel-recomendado" class="carrusel"></div>

            <button class="carousel__arrow carousel__arrow--next btn-next" type="button" aria-label="Siguiente">
                <img src="assets/icons/arrow-right.svg" alt="" aria-hidden="true" />
            </button>
        </div>
    </section>

    <section>
        <h3>Juegos de accion</h3>
        <div class="carrusel-wrapper">
            <button class="carousel__arrow carousel__arrow--prev btn-previous" type="button" aria-label="Anterior">
                <img src="assets/icons/arrow-left.svg" alt="" aria-hidden="true" />
            </button>

            <div id="carrusel-accion" class="carrusel"></div>

            <button class="carousel__arrow carousel__arrow--next btn-next" type="button" aria-label="Siguiente">
                <img src="assets/icons/arrow-right.svg" alt="" aria-hidden="true" />
            </button>
        </div>
    </section>

    <section>
        <h3>Juegos de puzzle</h3>
        <div class="carrusel-wrapper">
            <button class="carousel__arrow carousel__arrow--prev btn-previous" type="button" aria-label="Anterior">
                <img src="assets/icons/arrow-left.svg" alt="" aria-hidden="true" />
            </button>

            <div id="carrusel-puzzle" class="carrusel"></div>

            <button class="carousel__arrow carousel__arrow--next btn-next" type="button" aria-label="Siguiente">
                <img src="assets/icons/arrow-right.svg" alt="" aria-hidden="true" />
            </button>
        </div>
    </section>

    <section>
        <h3>Juegos de cocinar</h3>
        <div class="carrusel-wrapper">
            <button class="carousel__arrow carousel__arrow--prev btn-previous" type="button" aria-label="Anterior">
                <img src="assets/icons/arrow-left.svg" alt="" aria-hidden="true" />
            </button>

            <div id="carrusel-cocina" class="carrusel"></div>

            <button class="carousel__arrow carousel__arrow--next btn-next" type="button" aria-label="Siguiente">
                <img src="assets/icons/arrow-right.svg" alt="" aria-hidden="true" />
            </button>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="js/loading.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script src="js/carousel-fila.js"></script>
    <script src="js/carousel-destacado.js"></script>
    <script src="js/home.js"></script>
</body>

</html>
